[Rig]
; Observing site. The public build defaults to 0,0 on purpose, so this
; file is now the ONLY place the real location lives -- and it is
; untracked, which is why the coordinates stay out of the repository.
; Alt/az tracking rates, the sky map and the ADC model all need it.

; Nominal plate scale: 206.265 * 2.0um / 2032mm = 0.203 arcsec/px
; (8SE at f/10 with the ASI678MC). Seeds overlays and solver hints;
; the tracker uses its measured calibration for corrections.
PlateScaleArcsecPx=0.203017

; Assumed on-sky guide rate behind PulseGuide. NexStar fixed rate 1 is
; taken to be about 0.5x sidereal. Phase 65 now measures this during
; calibration and logs it -- if the measured figure differs, correct
; this value to match.
GuideRateArcsecPerSec=7.500000

; Serial port for the NexStar hand control. Leave empty to auto-detect
; by probing present ports with the NexStar echo. Set e.g. COM4 only to
; override a scan that picks the wrong device.
MountPort=

